---
# Certbot setup

# Renewal uses the webroot authenticator (NOT the nginx plugin):
# python3-certbot-nginx can disappear on an OS dist-upgrade and silently break
# renewal (regression: 2026-06, certs expired). webroot ships with certbot core.
# nginx serves this directory under /.well-known/acme-challenge/ (see nginx.conf.j2).
- name: Create ACME webroot directory
  file:
    path: "{{ paths.webroot }}/.well-known/acme-challenge"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  become: yes

- name: Create certificate directory for ubuntu user
  file:
    path: "{{ paths.certs }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  become: yes

- name: Copy cert files in loop
  copy:
    src: "/etc/letsencrypt/live/{{ domains.masterserver }}/{{ item }}"
    dest: "{{ paths.certs }}/{{ item }}"
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  loop:
    - fullchain.pem
    - privkey.pem
  become: yes
  ignore_errors: yes
  notify: restart masterserver

- name: Create certbot renewal hook directory
  file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: '0755'
  become: yes

- name: Install certbot renewal hook
  template:
    src: ../templates/copy-certs.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/copy-certs.sh
    mode: '0755'
  become: yes

- name: Enable certbot renewal timer
  systemd:
    name: certbot.timer
    enabled: yes
    state: started
  become: yes
