---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Upgrade all packages
  apt:
    upgrade: dist
  become: yes

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - fail2ban
      - htop
      - vim
      - fuse
    state: present
  become: yes

- name: Configure UFW - allow SSH
  ufw:
    rule: allow
    port: "{{ ansible_port | default('22') }}"
    proto: tcp
  become: yes

- name: Configure UFW - allow standard ports
  ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ firewall_allowed_ports }}"
  become: yes

- name: Enable UFW
  ufw:
    state: enabled
  become: yes

- name: Ensure fail2ban is running
  systemd:
    name: fail2ban
    state: started
    enabled: yes
  become: yes

# Official servers sign their heartbeats with a timestamp; the masterserver rejects clocks off by more than 30 s.
- name: Ensure the clock is synchronized
  systemd:
    name: systemd-timesyncd
    state: started
    enabled: yes
  become: yes

# The host's time zone: an official server's ranked matches get happy hours (2x, Friday to Sunday 19:00-21:00) there.
# A host left in UTC has none - set `timezone` (an IANA name) for every host in the inventory.
- name: Set the time zone
  command: timedatectl set-timezone {{ timezone }}
  become: yes
  when: timezone is defined
  changed_when: false

